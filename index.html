<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서연·서우 보드</title>
<meta name="description" content="서연·서우 학원 시간표와 숙제·준비물 보드">
<meta name="theme-color" content="#FFF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="서연·서우">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#FFF8F2;
    --bg2:#FFF1E6;
    --card:#FFFFFF;
    --ink:#332B25;
    --ink-soft:#6B5F55;
    --muted:#A2968A;
    --line:#F0E5DA;
    --accent:#EF8A62;
    --accent-deep:#D9704A;
    --accent-soft:#FFE7DB;
    --shadow:0 2px 12px rgba(170,120,85,.08);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, #FFF1E4 0%, rgba(255,241,228,0) 70%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-text-size-adjust:100%;
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  /* header */
  .top{
    display:flex;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 0 10px;
  }
  .mark{
    width:44px;height:44px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(145deg,#FFD9C2,#F7A882);
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 4px 12px rgba(239,138,98,.25);
  }
  .brand-txt{min-width:0}
  h1{font-size:19px;margin:0;letter-spacing:-.3px;font-weight:800}
  .today-line{margin:1px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
  .icon-btn{
    margin-left:auto;flex:0 0 auto;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;
    font-family:inherit;box-shadow:var(--shadow);cursor:pointer;
  }
  .icon-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  /* tabs */
  .tabs{
    position:sticky;top:0;z-index:20;
    display:flex;gap:4px;padding:6px;margin:4px 0 14px;
    background:rgba(255,248,242,.92);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);
  }
  .tab{
    flex:1;border:0;background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.4px;
    padding:10px 2px;border-radius:12px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(170,120,85,.14)}
  .edit-bar{
    margin:-6px 0 12px;padding:9px 13px;border-radius:12px;
    background:var(--accent-soft);color:#8E4A2E;font-size:12.5px;font-weight:600;
  }
  .edit-bar b{font-weight:800}
  [hidden]{display:none !important}

  /* generic card */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:12px;
  }

  /* day bar */
  .daybar{display:flex;gap:7px;margin-bottom:12px}
  .day{
    flex:1;position:relative;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:9px 0 8px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;transition:.15s;
  }
  .day.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .day.today:not(.active){border-color:#F3B79B;color:var(--accent-deep)}
  .day .dot{position:absolute;top:6px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .day.active .dot{background:#FFD3BB}

  /* now strip */
  .nowstrip{padding:10px 14px;background:linear-gradient(180deg,#FFFDFA,#FFF8F1)}
  .strip-row{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:13.5px}
  .strip-row + .strip-row{border-top:1px dashed var(--line)}
  .strip-row .who{font-weight:800;color:var(--ink);flex:0 0 34px}
  .strip-row .what{font-weight:700;color:var(--accent-deep);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip-row .when{color:var(--muted);font-size:12px;font-weight:600;flex:0 0 auto}

  /* kid card */
  .kid-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .avatar{
    width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
    font-size:14px;font-weight:800;background:var(--a);color:var(--af);
  }
  .kid-head b{font-size:16px;letter-spacing:-.2px}
  .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}

  .rows{list-style:none;margin:0;padding:0}
  .row{
    display:flex;align-items:stretch;gap:9px;padding:4px 0;
    border-radius:12px;
  }
  .row .t{
    flex:0 0 52px;display:flex;flex-direction:column;justify-content:center;
    font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:-.2px;
    padding-top:2px;
  }
  .row .t b{font-size:13.5px;color:var(--ink-soft)}
  .row .t span{font-size:11.5px;font-weight:600}
  .blk{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--bg);color:var(--fg);
    border-radius:12px;padding:9px 12px;
    font-weight:800;font-size:15px;letter-spacing:-.2px;
    border-left:4px solid rgba(0,0,0,.06);
  }
  .blk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{
    margin-left:auto;flex:0 0 auto;font-style:normal;
    font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;
    background:rgba(255,255,255,.75);color:inherit;
  }
  .badge.now{background:var(--accent);color:#fff}
  .badge.next{background:#fff;color:var(--accent-deep);box-shadow:0 0 0 1px #F6C9B4 inset}
  .row.is-now .blk{box-shadow:0 0 0 2px rgba(239,138,98,.45), 0 4px 12px rgba(239,138,98,.18)}
  .row.is-next .blk{box-shadow:0 0 0 1px rgba(239,138,98,.25)}
  .editcue{flex:0 0 auto;align-self:center;color:#D9C6B7;font-size:15px}
  .row.editable{cursor:pointer}
  .row.editable:active{background:#FFF6EE}
  .rows .empty{padding:8px 2px}
  .empty{margin:0;color:var(--muted);font-size:13px;font-weight:600}
  .add-row{
    width:100%;margin-top:8px;border:1px dashed #E6D6C8;background:#FFFCF9;
    color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:700;
    padding:9px;border-radius:12px;cursor:pointer;
  }

  /* weekend */
  .weekend{text-align:center;padding:26px 16px}
  .wk-emoji{font-size:34px;line-height:1}
  .weekend h3{margin:8px 0 4px;font-size:17px}
  .weekend p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.6}

  /* meal */
  .meal{background:linear-gradient(180deg,#FFFDFA,#FFF8F0)}
  .meal-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .meal-ico{
    width:30px;height:30px;border-radius:10px;flex:0 0 auto;
    background:#FFEBD6;display:grid;place-items:center;font-size:16px;
  }
  .meal-head b{font-size:16px;letter-spacing:-.2px}
  .meal-date{
    margin-left:auto;flex:0 0 auto;white-space:nowrap;
    font-size:11.5px;font-weight:800;color:var(--accent-deep);
    background:var(--accent-soft);padding:4px 9px;border-radius:999px;
  }
  .dishes{display:flex;flex-wrap:wrap;gap:6px}
  .dish{
    background:#fff;border:1px solid #F4E7DB;border-radius:10px;
    padding:6px 10px;font-size:13.5px;font-weight:700;color:#4A3E35;
    letter-spacing:-.2px;line-height:1.35;word-break:keep-all;
  }
  .dish sup{
    font-size:9px;font-weight:800;color:#C4835F;margin-left:2px;
    vertical-align:super;letter-spacing:0;
  }
  .meal-foot{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:22px}
  .kcal{
    font-size:11.5px;font-weight:800;color:#96705A;background:#FFEFE2;
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .alg-btn{
    margin-left:auto;border:0;background:transparent;color:var(--muted);
    font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 2px;cursor:pointer;
    text-decoration:underline;text-underline-offset:2px;
  }
  .alg-note{margin:6px 0 14px;font-size:11px;color:var(--muted);line-height:1.6;text-align:center}
  .alg-note .alg-btn{margin:0;font-size:11.5px}
  .weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .weeknav button{
    flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);border-radius:12px;font-family:inherit;font-size:17px;
    font-weight:800;line-height:1;cursor:pointer;box-shadow:var(--shadow);
  }
  .weeknav button:disabled{opacity:.35;cursor:default}
  .weeknav .wk-label{
    flex:1;text-align:center;font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.3;
  }
  .weeknav .wk-label span{
    display:block;font-size:11.5px;font-weight:700;color:var(--muted);
    letter-spacing:0;margin-top:1px;
  }
  .meal-day .dayhead .kcal{margin-left:auto}

  /* week view */
  .kidtabs{display:flex;gap:7px;margin-bottom:12px}
  .kidtab{
    flex:1;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-family:inherit;font-size:14.5px;font-weight:800;padding:10px;border-radius:14px;cursor:pointer;
  }
  .kidtab.active{background:var(--c);border-color:transparent;color:#fff}
  .daycard{padding:12px 12px 13px}
  .dayhead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .dayhead .dn{font-size:15px;font-weight:800}
  .dayhead .dsub{font-size:11px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);padding:2px 6px;border-radius:6px}
  .daycard.today{border-color:#F6CDB9;background:linear-gradient(180deg,#FFFDFB,#FFFAF5)}
  .mini-add{
    margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--accent-deep);
    width:28px;height:28px;border-radius:9px;font-size:15px;font-weight:800;line-height:1;cursor:pointer;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    position:relative;display:flex;flex-direction:column;gap:1px;align-items:flex-start;
    border:0;background:var(--bg);color:var(--fg);
    padding:8px 11px;border-radius:12px;font-family:inherit;text-align:left;
    min-width:86px;cursor:default;
  }
  .chip.editable{cursor:pointer;padding-right:26px}
  .chip .cn{font-size:13.5px;font-weight:800;line-height:1.25}
  .chip .ct{font-size:11px;font-weight:700;opacity:.72;font-variant-numeric:tabular-nums}
  .chip .del{
    position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    background:rgba(255,255,255,.85);color:#C2603F;display:grid;place-items:center;
    font-size:10px;font-weight:900;
  }
  .empty-chip{color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 0}

  /* homework */
  .hadd{display:flex;gap:6px;margin-bottom:10px}
  .hadd select{
    flex:0 0 84px;font-family:inherit;font-size:12.5px;font-weight:700;
    border:1px solid var(--line);background:#FFFCF9;color:var(--ink-soft);
    border-radius:11px;padding:9px 6px;appearance:none;text-align:center;
  }
  .hadd input[type=text]{
    flex:1;min-width:0;font-family:inherit;font-size:14px;
    border:1px solid var(--line);background:#FFFCF9;color:var(--ink);
    border-radius:11px;padding:9px 11px;
  }
  .hadd input::placeholder{color:#C4B6A9}
  .hadd input:focus,.hadd select:focus{outline:none;border-color:#F0B79C;background:#fff}
  .hbtn{
    flex:0 0 auto;border:0;background:var(--ink);color:#fff;
    font-family:inherit;font-size:13px;font-weight:800;padding:0 13px;border-radius:11px;cursor:pointer;
  }
  .hlist{list-style:none;margin:0;padding:0}
  .hrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #FAF3EC}
  .hrow:last-child{border-bottom:0}
  .check{
    flex:0 0 auto;width:23px;height:23px;border-radius:8px;cursor:pointer;
    border:1.5px solid #E2D3C6;background:#fff;color:#fff;font-size:12px;font-weight:900;
    display:grid;place-items:center;padding:0;line-height:1;
  }
  .hrow.done .check{background:#8DC8AC;border-color:#8DC8AC}
  .ht{flex:1;min-width:0;font-size:14.5px;font-weight:600;word-break:break-word}
  .hrow.done .ht{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
  .ttype{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px}
  .ttype.숙제{background:#FFE7DB;color:#B85B34}
  .ttype.준비물{background:#DDEBFA;color:#3E6E9A}
  .ttype.메모{background:#EFEAF7;color:#6A5490}
  .x{
    flex:0 0 auto;border:0;background:transparent;color:#D2C2B4;
    font-size:13px;font-weight:800;padding:4px 2px 4px 6px;cursor:pointer;
  }
  .clear-done{
    margin-top:10px;border:0;background:#FFF6EE;color:var(--ink-soft);
    font-family:inherit;font-size:12.5px;font-weight:700;padding:9px;width:100%;
    border-radius:11px;cursor:pointer;
  }

  /* settings */
  .settings{margin:4px 0 10px}
  .settings-toggle{
    width:100%;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-family:inherit;font-size:13.5px;font-weight:700;padding:12px;border-radius:15px;
    cursor:pointer;box-shadow:var(--shadow);
  }
  .settings-body{margin-top:9px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#FFFCF9}
  .hint{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .hint.tiny{margin:10px 0 0;color:var(--muted);font-size:11.5px}
  .settings-actions{display:flex;flex-wrap:wrap;gap:7px}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:11px;cursor:pointer;
  }
  .btn.light{background:#fff}
  .btn.danger-text{color:#BF5B41;border-color:#F2D4C8}
  .primary{border:0;background:var(--accent);color:#fff}
  .ghost{border:1px solid var(--line);background:#fff;color:var(--ink-soft)}

  /* sheet */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .backdrop{position:absolute;inset:0;background:rgba(60,44,34,.34);opacity:0;transition:opacity .18s}
  .sheet{
    position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;
    background:#fff;border-radius:24px 24px 0 0;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 40px rgba(90,60,40,.18);
  }
  .sheet-wrap.open .backdrop{opacity:1}
  .sheet-wrap.open .sheet{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:#EBDCD0;margin:6px auto 12px}
  .sheet h2{margin:0 0 12px;font-size:17px}
  .sheet label.fl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px}
  .seg{display:flex;gap:6px}
  .seg button{
    flex:1;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-family:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:11px;cursor:pointer;
  }
  .seg button.on{background:var(--accent-soft);border-color:#F4C4AE;color:#A9522B}
  .seg.days button{padding:8px 0;font-size:13.5px}
  .fin{
    width:100%;font-family:inherit;font-size:15px;font-weight:600;
    border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#FFFCF9;color:var(--ink);
  }
  .fin:focus{outline:none;border-color:#F0B79C;background:#fff}
  .two{display:flex;gap:8px}
  .two > div{flex:1;min-width:0}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cats button{
    border:2px solid transparent;border-radius:10px;padding:8px 4px;font-family:inherit;
    font-size:12px;font-weight:800;cursor:pointer;
  }
  .cats button.on{border-color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions button{flex:1;font-family:inherit;font-size:14.5px;font-weight:800;padding:13px;border-radius:13px;cursor:pointer}
  .sheet .danger{
    width:100%;margin-top:9px;border:0;background:#FFF3EF;color:#C15A3D;
    font-family:inherit;font-size:13.5px;font-weight:800;padding:12px;border-radius:13px;cursor:pointer;
  }

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:rgba(51,43,37,.94);color:#fff;font-size:13px;font-weight:700;
    padding:11px 15px;border-radius:14px;display:flex;align-items:center;gap:10px;
    opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{
    border:0;background:transparent;color:#FFC9AE;font-family:inherit;font-size:13px;
    font-weight:800;text-decoration:underline;cursor:pointer;padding:0;
  }
  footer.note{text-align:center;color:#C3B4A7;font-size:11px;margin:20px 0 0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">📚</div>
    <div class="brand-txt">
      <h1>서연·서우 보드</h1>
      <p class="today-line" id="todayLine">불러오는 중…</p>
    </div>
    <button class="icon-btn" id="editBtn" aria-pressed="false">일정 편집</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="보드 보기">
    <button class="tab active" data-view="today" role="tab">오늘</button>
    <button class="tab" data-view="week" role="tab" title="주간 시간표">시간표</button>
    <button class="tab" data-view="homework" role="tab" title="숙제·준비물">숙제</button>
    <button class="tab" data-view="meal" role="tab" title="함박초 급식">🍱 급식</button>
  </nav>

  <div class="edit-bar" id="editBar" hidden>편집 중 · 회색 ✎ 항목을 누르면 고칠 수 있고, <b>＋</b>로 추가할 수 있어요</div>

  <main>
    <section id="view-today" class="view">
      <div class="daybar" id="dayBar"></div>
      <div id="todayBody"></div>
    </section>

    <section id="view-week" class="view" hidden>
      <div class="kidtabs" id="kidTabs"></div>
      <div id="weekBody"></div>
      <div class="settings">
        <button class="settings-toggle" id="settingsToggle">⚙️ 설정 · 백업 / 초기화</button>
        <div class="settings-body" id="settingsBody" hidden>
          <p class="hint">여기서 고친 시간표와 숙제는 <b>이 휴대폰 브라우저</b>에 저장돼요. 다른 기기나 다른 브라우저에서는 처음 상태로 보여요.</p>
          <div class="settings-actions">
            <button class="btn light" id="btnBackup">백업 파일 저장</button>
            <label class="btn light">불러오기<input type="file" id="fileImport" accept="application/json,.json" hidden></label>
            <button class="btn light danger-text" id="btnReset">기본값으로 초기화</button>
          </div>

<script>
(function(){
  'use strict';

  /* ---------- 기본 데이터 ---------- */
  var CATS = {
    school:       { label:'하교·학교', bg:'#EFEDEA', fg:'#625B54' },

  };
  var CAT_ORDER = ['school','violin','taekwondo','art','reading','math','creativeMath','english','study1031','piano','computer','neulbom','etc'];

  var CHILDREN = [
    { id:'seoyeon', name:'서연', color:'#EF8A62', bg:'#FFE3D5', fg:'#C25E33' },
    { id:'seowoo',  name:'서우', color:'#6FA9D6', bg:'#DCEBF9', fg:'#38678C' }
  ];

  var DAY_NAMES = ['월','화','수','목','금'];

  var DEFAULT_ROWS = [
    ['seoyeon',1,'하교','14:30','','school'],
    ['seoyeon',1,'바이올린','14:30','15:30','violin'],
    ['seoyeon',1,'태권도','16:00','16:50','taekwondo'],
    ['seoyeon',1,'미술','17:00','18:30','art'],
    ['seoyeon',2,'하교','14:30','','school'],
    ['seoyeon',2,'리드인','15:00','15:55','reading'],
    ['seoyeon',2,'수학','16:30','18:00','math'],
    ['seoyeon',3,'하교','14:30','','school'],
    ['seoyeon',3,'리드인','15:00','16:55','reading'],
    ['seoyeon',3,'영어','17:20','18:30','english'],
    ['seoyeon',4,'하교','14:30','','school'],
    ['seoyeon',4,'태권도','15:00','15:50','taekwondo'],
    ['seoyeon',4,'수학','16:30','18:00','math'],
    ['seoyeon',5,'하교','13:50','','school'],
    ['seoyeon',5,'태권도','14:00','14:50','taekwondo'],
    ['seoyeon',5,'리드인','15:00','15:55','reading'],
    ['seoyeon',5,'영어','16:15','17:45','english'],

    ['seowoo',1,'늘봄 종이접기','12:50','13:30','neulbom'],
    ['seowoo',1,'늘봄 종이접기','13:40','14:20','neulbom'],
    ['seowoo',1,'피아노','14:30','15:45','piano'],
    ['seowoo',1,'태권도','16:00','16:50','taekwondo'],
    ['seowoo',2,'미술','14:00','15:20','art'],
    ['seowoo',2,'피아노','15:30','16:45','piano'],
    ['seowoo',2,'태권도','17:00','17:50','taekwondo'],
    ['seowoo',3,'컴퓨터','14:00','15:20','computer'],
    ['seowoo',3,'창의수학','15:30','16:20','creativeMath'],
    ['seowoo',4,'태권도','14:00','14:50','taekwondo'],
    ['seowoo',4,'피아노','15:00','16:30','piano'],
    ['seowoo',5,'늘봄 놀이체육','12:50','13:30','neulbom'],
    ['seowoo',5,'바이올린','13:40','15:10','violin'],
    ['seowoo',5,'피아노','15:20','16:00','piano'],
    ['seowoo',5,'1031','16:15','17:45','study1031']
  ];

  /* ---------- 저장소 ---------- */
  var KEY_SCHEDULE = 'kidsboard.schedule.v1';
  var KEY_HW = 'kidsboard.homework.v1';

  function defaultClasses(){
    return DEFAULT_ROWS.map(function(r,i){
      return { id:'d'+i, child:r[0], day:r[1], title:r[2], start:r[3], end:r[4], cat:r[5] };
    });
  }

  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

  function sanitizeClasses(list){
    if(!Array.isArray(list)) return null;
    var validChild = { seoyeon:1, seowoo:1 };
    var out = [];
    list.forEach(function(c,i){
      if(!c || typeof c !== 'object') return;
      if(!validChild[c.child]) return;
      var day = parseInt(c.day,10);
      if(!(day >= 1 && day <= 5)) return;
      if(typeof c.title !== 'string' || !c.title.trim()) return;
      if(typeof c.start !== 'string' || !TIME_RE.test(c.start)) return;
      var end = (typeof c.end === 'string' && TIME_RE.test(c.end)) ? c.end : '';
      var cat = CATS[c.cat] ? c.cat : 'etc';
      out.push({
        id: typeof c.id === 'string' && c.id ? c.id : 'x'+i+Date.now().toString(36),
        child: c.child, day: day, title: c.title.slice(0,40), start: c.start, end: end, cat: cat
      });
    });
    return out;
  }

  function sanitizeHw(raw){
    var out = { seoyeon:[], seowoo:[] };
    if(!raw || typeof raw !== 'object') return out;
    ['seoyeon','seowoo'].forEach(function(k){
      var arr = Array.isArray(raw[k]) ? raw[k] : [];
      arr.forEach(function(it,i){
        if(!it || typeof it !== 'object') return;
        if(typeof it.text !== 'string' || !it.text.trim()) return;
        var type = (it.type === '준비물' || it.type === '메모') ? it.type : '숙제';
        out[k].push({
          id: typeof it.id === 'string' && it.id ? it.id : k+i+Date.now().toString(36),
          text: it.text.slice(0,120),
          type: type,
          done: !!it.done
        });
      });
    });
    return out;
  }

  var classes = defaultClasses();
  var homework = { seoyeon:[], seowoo:[] };

  function load(){
    try{
      var raw = localStorage.getItem(KEY_SCHEDULE);
      if(raw){
        var p = JSON.parse(raw);
        var s = sanitizeClasses(p && p.classes);
        if(s) classes = s;
      }
    }catch(e){}
    try{
      var raw2 = localStorage.getItem(KEY_HW);
      if(raw2){
        var p2 = JSON.parse(raw2);
        homework = sanitizeHw(p2);
      }
    }catch(e){}
  }
  function saveSchedule(){
    try{ localStorage.setItem(KEY_SCHEDULE, JSON.stringify({ classes: classes })); }catch(e){}
  }
  function saveHw(){
    try{ localStorage.setItem(KEY_HW, JSON.stringify(homework)); }catch(e){}
  }

  /* ---------- 유틸 ---------- */
  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function toMin(t){
    var p = String(t || '').split(':');
    return (parseInt(p[0],10) || 0) * 60 + (parseInt(p[1],10) || 0);
  }
  function kstNow(){
    var d = new Date();
    try{
      var parts = new Intl.DateTimeFormat('en-US', {
        timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
      }).formatToParts(d);
      var o = {};
      parts.forEach(function(p){ o[p.type] = p.value; });
      var h = parseInt(o.hour, 10);
      if(h === 24) h = 0;
      return new Date(parseInt(o.year,10), parseInt(o.month,10)-1, parseInt(o.day,10), h, parseInt(o.minute,10), parseInt(o.second,10));
    }catch(e){ return d; }
  }
  function todayDow(){
    var d = kstNow().getDay();
    return (d >= 1 && d <= 5) ? d : null;
  }
  function dayList(child, day){
    return classes.filter(function(c){ return c.child === child && c.day === day; })
      .sort(function(a,b){
        var d = toMin(a.start) - toMin(b.start);
        if(d) return d;
        return (a.end ? toMin(a.end) : toMin(a.start)) - (b.end ? toMin(b.end) : toMin(b.start));
      });
  }
  function minsLabel(m){
    if(m < 60) return m + '분';
    return Math.floor(m/60) + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '');
  }

  /* ---------- 급식 (함박초 NEIS) ---------- */
  var NEIS = { office:'J10', school:'7751355', name:'함박초등학교' };
  var KEY_MEALS = 'kidsboard.meals.v1';
  var KEY_ALG = 'kidsboard.allergy.v1';

  var mealIndex = {};        // 'YYYY-MM-DD' -> meal
  var mealLive = {};         // NEIS에서 직접 받아 둔 것(휴대폰 저장소 캐시)
  var mealFetched = {};      // 주 단위로 이미 요청한 범위
  var staticMealsLoaded = false;
  var mealWeekOffset = 0;
  var showAllergy = false;

  function pad2(n){ return ('0' + n).slice(-2); }
  function ymdOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function startOfToday(){ var k = kstNow(); return new Date(k.getFullYear(), k.getMonth(), k.getDate()); }
  function mondayOf(d){
    var dow = d.getDay();
    var diff = (dow === 0) ? -6 : (1 - dow);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }
  function weekMonday(offset){
    var m = mondayOf(kstNow());
    return new Date(m.getFullYear(), m.getMonth(), m.getDate() + 7 * (offset || 0));
  }
  /* 오늘 탭에서 고른 요일이 실제로 며칠인지: 이번 주 해당 요일, 이미 지났으면 다음 주 */
  function dateForDow(dow){
    var t = startOfToday();
    var m = mondayOf(t);
    var d = new Date(m.getFullYear(), m.getMonth(), m.getDate() + dow - 1);
    if(d < t) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
    return d;
  }
  function mealOf(key){ return mealIndex[key] || null; }

  function cleanDish(raw){
    var s = String(raw || '').trim(), al = [];
    if(!s) return { name:'', allergy:[] };
    /* 괄호로 끝나면 짝이 맞는 ‘(’를 찾아 내용을 살핍니다.
       - 숫자·점만 있으면 알레르기 번호 → 따로 나누어 둡니다.
       - 너무 긴 설명(예: ‘세계김치의 날, 우리김치주간(선택)’)은 화면을 깔끔하게 하려고 접습니다. */
    while(s.charAt(s.length - 1) === ')'){
      var depth = 0, idx = -1, i;
      for(i = s.length - 1; i >= 0; i--){
        var ch = s.charAt(i);
        if(ch === ')') depth++;
        else if(ch === '('){ depth--; if(depth === 0){ idx = i; break; } }
      }
      if(idx < 0) break;
      var inner = s.slice(idx + 1, s.length - 1).trim();
      if(inner && /^[\d.\s]+$/.test(inner)){
        al = inner.split(/[.\s]+/).filter(function(x){ return /^\d+$/.test(x); });
        s = s.slice(0, idx).trim();
        continue;
      }
      if(inner.length > 10){
        s = s.slice(0, idx).trim();
        continue;
      }
      break;
    }
    s = s.replace(/\s*\((?:초|중|고)\)\s*$/, '')
         .replace(/\u2665/g, '')
         .replace(/\s{2,}/g, ' ')
         .trim();
    if(/[가-힣]m$/.test(s)) s = s.slice(0, -1);
    return { name:s, allergy:al };
  }

  function parseNeis(json){
    var out = {};
    var blk = json && json.mealServiceDietInfo;
    if(!blk || !blk.length) return out;
    var rows = [];
    blk.forEach(function(p){ if(p && p.row) rows = rows.concat(p.row); });
    rows.forEach(function(r){
      if(r.MMEAL_SC_CODE !== '2') return;                 // 중식만
      var y = String(r.MLSV_YMD || '');
      if(y.length !== 8) return;
      var key = y.slice(0,4) + '-' + y.slice(4,6) + '-' + y.slice(6,8);
      if(out[key]) return;
      var dishes = String(r.DDISH_NM || '').split(/<br\s*\/?>/i)
        .map(cleanDish).filter(function(x){ return x.name; });
      var cal = String(r.CAL_INFO || '').replace(/\s*kcal/i, '').trim();
      var num = parseFloat(cal);
      out[key] = {
        ymd:y, date:key, meal:r.MMEAL_SC_NM || '중식',
        dishes:dishes, cal:String(r.CAL_INFO || '').trim(),
        calNum: isNaN(num) ? null : num
      };
    });
    return out;
  }

  function mergeMeals(obj){
    if(!obj) return 0;
    var n = 0;
    Object.keys(obj).forEach(function(k){
      if(!obj[k] || !obj[k].dishes) return;
      if(!mealIndex[k]) n++;
      mealIndex[k] = obj[k];
    });
    return n;
  }

  function loadMealCache(){
    try{
      var raw = localStorage.getItem(KEY_MEALS);
      if(raw){
        var p = JSON.parse(raw);
        if(p && p.meals){
          mealLive = p.meals;
          mergeMeals(p.meals);
        }
      }
    }catch(e){}
    try{ showAllergy = localStorage.getItem(KEY_ALG) === '1'; }catch(e){}
  }
  function saveMealCache(){
    try{ localStorage.setItem(KEY_MEALS, JSON.stringify({ savedAt: Date.now(), meals: mealLive })); }catch(e){}
  }

  function loadStaticMeals(){
    fetch('./meals.json', { cache:'no-cache' }).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(d){
      if(!d || !d.meals) return;
      staticMealsLoaded = true;
      mergeMeals(d.meals);
      renderMealViews();
    }).catch(function(){});
  }

  function neisUrl(fromYmd, toYmd){
    return 'https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json' +
      '&ATPT_OFCDC_SC_CODE=' + NEIS.office +
      '&SD_SCHUL_CODE=' + NEIS.school +
      '&MLSV_FROM_YMD=' + fromYmd + '&MLSV_TO_YMD=' + toYmd;
  }

  /* 월~금 5일치를 한 번에 받아 옵니다(키 없이도 되는 범위). 실패하면 meals.json·저장된 자료로 보여 줍니다. */
  function fetchMealsForWeek(offset){
    var mon = weekMonday(offset);
    var at = ymdOf(mon);
    if(mealFetched[at]) return;
    mealFetched[at] = true;
    var fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4);
    var from = ymdOf(mon).replace(/-/g, '');
    var to = ymdOf(fri).replace(/-/g, '');
    fetch(neisUrl(from, to), { cache:'no-store' }).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      var got = parseNeis(j);
      var fresh = 0;
      Object.keys(got).forEach(function(k){
        if(!mealLive[k]) fresh++;
        mealLive[k] = got[k];
        mealIndex[k] = got[k];
      });
      if(fresh) saveMealCache();
      renderMealViews();
    }).catch(function(){
      mealFetched[at] = false;   // 다음에 다시 시도
    });
  }

  function renderMealViews(){
    if(view === 'today') renderToday();
    if(view === 'meal') renderMeal();
  }

  function dishesHtml(dishes){
    return dishes.map(function(d){
      var sup = (showAllergy && d.allergy && d.allergy.length)
        ? '<sup>' + esc(d.allergy.join('.')) + '</sup>' : '';
      return '<span class="dish">' + esc(d.name) + sup + '</span>';
    }).join('');
  }
  function hasAllergyInfo(dishes){
    return dishes.some(function(d){ return d.allergy && d.allergy.length; });
  }
  function algBtnHtml(label){
    return '<button type="button" class="alg-btn" data-alg="1" aria-pressed="' + (showAllergy ? 'true' : 'false') + '">' +
      esc(label) + '</button>';
  }

  function mealCardHtml(date, emptyText){
    var key = ymdOf(date);
    var m = mealOf(key);
    var names = ['일','월','화','수','목','금','토'];
    var dateLabel = (date.getMonth()+1) + '월 ' + date.getDate() + '일 ' + names[date.getDay()] + '요일';
    var head = '<header class="meal-head">' +
        '<span class="meal-ico" aria-hidden="true">🍱</span>' +
        '<b>함박초 급식</b>' +
        '<span class="meal-date">' + esc(dateLabel) + '</span>' +
      '</header>';
    if(!m){
      return '<section class="card meal">' + head +
        '<p class="empty">' + esc(emptyText || '이 날 급식표는 아직 안 올라왔어요') + '</p>' +
      '</section>';
    }
    var kcal = m.calNum ? '<span class="kcal">' + Math.round(m.calNum) + ' kcal</span>' : '';
    return '<section class="card meal">' + head +
      '<div class="dishes">' + dishesHtml(m.dishes) + '</div>' +
      '<div class="meal-foot">' + kcal +
        (hasAllergyInfo(m.dishes) ? algBtnHtml(showAllergy ? '알레르기 번호 숨기기' : '알레르기 번호') : '') +
      '</div>' +
    '</section>';
  }

  function weekLabel(offset){
    if(offset === 0) return '이번 주';
    if(offset === 1) return '다음 주';
    if(offset === -1) return '지난 주';
    return offset > 0 ? offset + '주 뒤' : (-offset) + '주 전';
  }

  function renderMeal(){
    var mon = weekMonday(mealWeekOffset);
    var fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4);
    var t = startOfToday();
    var todayKey = ymdOf(t);
    var days = [], any = false;
    for(var i = 0; i < 5; i++){
      var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
      var m = mealOf(ymdOf(d));
      if(m) any = true;
      days.push({ d:d, m:m });
    }

    var html = '<div class="weeknav">' +
        '<button type="button" data-week="-1" aria-label="지난 주"' + (mealWeekOffset <= -2 ? ' disabled' : '') + '>‹</button>' +
        '<div class="wk-label">' + esc(weekLabel(mealWeekOffset)) + ' 급식' +
          '<span>' + (mon.getMonth()+1) + '월 ' + mon.getDate() + '일 ~ ' + (fri.getMonth()+1) + '월 ' + fri.getDate() + '일</span>' +
        '</div>' +
        '<button type="button" data-week="1" aria-label="다음 주"' + (mealWeekOffset >= 2 ? ' disabled' : '') + '>›</button>' +
      '</div>';

    if(!any){
      html += '<div class="card weekend" style="padding:30px 16px">' +
        '<div class="wk-emoji">🍱</div>' +
        '<h3>' + esc(weekLabel(mealWeekOffset)) + ' 급식표는 아직 없어요</h3>' +
        '<p>학교에서 식단을 올리면 여기에 바로 보여요.<br>잠시 뒤 다시 열어 보세요.</p>' +

        var body = it.m

          : '<span class="empty-chip">이 날은 급식 정보가 없어요</span>';
        return '<div class="card daycard meal-day' + (isToday ? ' today' : '') + '">' +
          '<div class="dayhead">' +
            '<span class="dn">' + DAY_NAMES[it.d.getDay()-1] + '</span>' +

  /* ---------- 상태 ---------- */
  var view = 'today';
  var selDay = todayDow();
  var weekChild = 'seoyeon';
  var editMode = false;
  var editId = null;
  var fChild = 'seoyeon', fDay = 1, fCat = 'etc';

  /* ---------- 렌더 ---------- */
  function renderHeader(){
    var k = kstNow();
    var names = ['일','월','화','수','목','금','토'];
    var hh = ('0' + k.getHours()).slice(-2);
    var mm = ('0' + k.getMinutes()).slice(-2);
    $('#todayLine').textContent = (k.getMonth()+1) + '월 ' + k.getDate() + '일 ' + names[k.getDay()] + '요일 · ' + hh + ':' + mm;
  }

  function renderDayBar(){
    var td = todayDow();
    $('#dayBar').innerHTML = DAY_NAMES.map(function(n,i){
      var d = i + 1;
      var cls = 'day';
      if(selDay === d) cls += ' active';
      if(td === d) cls += ' today';
      return '<button class="' + cls + '" data-day="' + d + '"><span>' + n + '</span>' + (td === d ? '<i class="dot"></i>' : '') + '</button>';
    }).join('');
  }

  function statusOf(list, mins){
    var nowIdx = -1, nextIdx = -1, i;
    for(i = 0; i < list.length; i++){
      var s = toMin(list[i].start);
      var e = list[i].end ? toMin(list[i].end) : s;
      if(mins >= s && mins < e){ nowIdx = i; break; }
    }
    if(nowIdx < 0){
      for(i = 0; i < list.length; i++){
        if(toMin(list[i].start) > mins){ nextIdx = i; break; }
      }
    }else if(nowIdx + 1 < list.length){
      nextIdx = nowIdx + 1;
    }
    return { nowIdx: nowIdx, nextIdx: nextIdx };
  }

  function summaryStrip(mins){
    var rows = CHILDREN.map(function(ch){
      var list = dayList(ch.id, selDay);
      var st = statusOf(list, mins);
      var main = '', sub = '';
      if(st.nowIdx >= 0){
        var c = list[st.nowIdx];
        main = '지금 ' + c.title;
        sub = c.end ? c.end + '까지' : c.start + '부터';
      }else if(st.nextIdx >= 0){
        var n = list[st.nextIdx];
        var d = toMin(n.start) - mins;
        main = '다음 ' + n.title;
        sub = (d <= 90 ? minsLabel(d) + ' 후' : n.start);
      }else{
        main = '오늘 일정 끝';
        sub = '수고했어요 ✨';
      }
      return '<div class="strip-row">' +
        '<span class="who">' + esc(ch.name) + '</span>' +
        '<span class="what">' + esc(main) + '</span>' +
        '<span class="when">' + esc(sub) + '</span>' +
      '</div>';
    }).join('');
    return '<div class="card nowstrip">' + rows + '</div>';
  }

  function kidDayCard(ch, day, isToday, mins){
    var list = dayList(ch.id, day);
    var st = isToday ? statusOf(list, mins) : { nowIdx:-1, nextIdx:-1 };
    var rows;
    if(!list.length){
      rows = '<p class="empty">이 날은 일정이 없어요</p>';
    }else{
      rows = list.map(function(c, i){
        var cat = CATS[c.cat] || CATS.etc;
        var badge = '';
        if(i === st.nowIdx) badge = '<em class="badge now">지금</em>';
        else if(i === st.nextIdx) badge = '<em class="badge next">다음</em>';
        var timeHtml = '<b>' + esc(c.start) + '</b>' + (c.end ? '<span>' + esc(c.end) + '</span>' : '');
        var cls = 'row' + (i === st.nowIdx ? ' is-now' : '') + (i === st.nextIdx ? ' is-next' : '') + (editMode ? ' editable' : '');
        return '<li class="' + cls + '" data-id="' + esc(c.id) + '">' +
          '<div class="t">' + timeHtml + '</div>' +
          '<div class="blk" style="--bg:' + cat.bg + ';--fg:' + cat.fg + '">' +
            '<span class="nm">' + esc(c.title) + '</span>' + badge +
          '</div>' +
          (editMode ? '<span class="editcue" aria-hidden="true">✎</span>' : '') +
        '</li>';
      }).join('');
    }
    var addBtn = editMode ? '<button class="add-row" data-add="' + ch.id + '" data-day="' + day + '">＋ 일정 추가</button>' : '';
    return '<section class="card kid">' +
      '<header class="kid-head">' +
        '<span class="avatar" style="--a:' + ch.bg + ';--af:' + ch.fg + '">' + esc(ch.name.charAt(0)) + '</span>' +
        '<b>' + esc(ch.name) + '</b>' +
        '<span class="count">' + list.length + '개</span>' +
      '</header>' +
      '<ul class="rows">' + rows + '</ul>' + addBtn +
    '</section>';
  }

  function renderToday(){
    renderDayBar();
    var body = $('#todayBody');
    var k = kstNow();
    var mins = k.getHours() * 60 + k.getMinutes();
    var td = todayDow();

    if(selDay == null){
      body.innerHTML = '<div class="card weekend">' +
        '<div class="wk-emoji">🎈</div>' +
        '<h3>오늘은 주말이에요</h3>' +
        '<p>학원은 월~금에 있어요.<br>위에서 요일을 누르면 그날 시간표를 볼 수 있어요.</p>' +
      '</div>';
      return;
    }

    var isToday = (selDay === td);
    var html = '';
    if(isToday) html += summaryStrip(mins);
    html += mealCardHtml(dateForDow(selDay), '이 날 급식표는 아직 안 올라왔어요');
    html += CHILDREN.map(function(ch){ return kidDayCard(ch, selDay, isToday, mins); }).join('');
    body.innerHTML = html;
  }

  function renderWeek(){
    $('#kidTabs').innerHTML = CHILDREN.map(function(ch){
      return '<button class="kidtab' + (weekChild === ch.id ? ' active' : '') + '" data-child="' + ch.id + '" style="--c:' + ch.color + '">' + esc(ch.name) + '</button>';
    }).join('');

    var ch = CHILDREN.filter(function(c){ return c.id === weekChild; })[0] || CHILDREN[0];
    var td = todayDow();
    var html = '';
    for(var d = 1; d <= 5; d++){
      var list = dayList(ch.id, d);
      var chips = list.map(function(c){
        var cat = CATS[c.cat] || CATS.etc;
        return '<button class="chip' + (editMode ? ' editable' : '') + '" data-id="' + esc(c.id) + '" style="--bg:' + cat.bg + ';--fg:' + cat.fg + '">' +
          '<span class="cn">' + esc(c.title) + '</span>' +
          '<span class="ct">' + esc(c.start) + (c.end ? '–' + esc(c.end) : '') + '</span>' +
          (editMode ? '<span class="del" data-del="' + esc(c.id) + '" role="button" aria-label="삭제">✕</span>' : '') +
        '</button>';
      }).join('');
      html += '<div class="card daycard' + (d === td ? ' today' : '') + '">' +
        '<div class="dayhead">' +
          '<span class="dn">' + DAY_NAMES[d-1] + '</span>' +
          (d === td ? '<span class="dsub">오늘</span>' : '') +
          (editMode ? '<button class="mini-add" data-add="' + ch.id + '" data-day="' + d + '" aria-label="일정 추가">＋</button>' : '') +
        '</div>' +
        '<div class="chips">' + (chips || '<span class="empty-chip">일정 없음</span>') + '</div>' +
      '</div>';
    }
    $('#weekBody').innerHTML = html;
  }

  function renderHomework(){
    $('#hwBody').innerHTML = CHILDREN.map(function(ch){
      var items = homework[ch.id] || [];
      var left = items.filter(function(i){ return !i.done; }).length;
      var list = items.map(function(it){
        return '<li class="hrow' + (it.done ? ' done' : '') + '">' +
          '<button class="check" data-toggle="' + esc(it.id) + '" data-child="' + ch.id + '" aria-pressed="' + (it.done ? 'true' : 'false') + '" aria-label="완료 표시">' + (it.done ? '✓' : '') + '</button>' +
          '<span class="ht">' + esc(it.text) + '</span>' +
          '<span class="ttype ' + esc(it.type) + '">' + esc(it.type) + '</span>' +
          '<button class="x" data-remove="' + esc(it.id) + '" data-child="' + ch.id + '" aria-label="삭제">✕</button>' +
        '</li>';
      }).join('');
      var cleared = items.some(function(i){ return i.done; })
        ? '<button class="clear-done" data-clear="' + ch.id + '">완료한 항목 지우기</button>'
        : '';
      return '<section class="card kid hw">' +
        '<header class="kid-head">' +
          '<span class="avatar" style="--a:' + ch.bg + ';--af:' + ch.fg + '">' + esc(ch.name.charAt(0)) + '</span>' +
          '<b>' + esc(ch.name) + '</b>' +
          '<span class="count">' + (items.length ? left + '개 남음' : '') + '</span>' +
        '</header>' +
        '<div class="hadd">' +
          '<select data-type-for="' + ch.id + '" aria-label="종류">' +
            '<option value="숙제">숙제</option><option value="준비물">준비물</option><option value="메모">메모</option>' +
          '</select>' +
          '<input type="text" data-input-for="' + ch.id + '" placeholder="예: 수학 12~15쪽 풀기" enterkeyhint="done" maxlength="120">' +
          '<button class="hbtn" data-addhw="' + ch.id + '">추가</button>' +
        '</div>' +
        '<ul class="hlist">' + (list || '<li class="empty">아직 적어 둔 게 없어요</li>') + '</ul>' +
        cleared +
      '</section>';
    }).join('');
  }

  function renderAll(){
    renderHeader();
    renderToday();
    renderWeek();
    renderHomework();
  }

  function syncEditUi(){
    var show = (view !== 'homework' && view !== 'meal');
    $('#editBtn').hidden = !show;
    $('#editBar').hidden = !(show && editMode);
  }

  function setView(v){
    view = v;
    $$('.tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view') === v); });
    $('#view-today').hidden = (v !== 'today');
    $('#view-week').hidden = (v !== 'week');
    $('#view-homework').hidden = (v !== 'homework');
    $('#view-meal').hidden = (v !== 'meal');
    syncEditUi();
    if(v === 'today') renderToday();
    if(v === 'week') renderWeek();
    if(v === 'homework') renderHomework();
    if(v === 'meal') renderMeal();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  /* ---------- 편집 모드 ---------- */
  function setEdit(on){
    editMode = on;
    $('#editBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('#editBtn').textContent = on ? '완료' : '일정 편집';
    syncEditUi();
    renderToday();
    renderWeek();
  }

  /* ---------- 시트 ---------- */
  function buildCatChips(){
    $('#fCat').innerHTML = CAT_ORDER.map(function(key){
      var c = CATS[key];
      return '<button type="button" data-cat="' + key + '" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(c.label) + '</button>';
    }).join('');
  }

  function syncSheet(){
    $$('#fChild button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === fChild); });
    $$('#fDay button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === String(fDay)); });
    $$('#fCat button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-cat') === fCat); });
  }

  function openSheet(opts){
    opts = opts || {};
    var c = opts.id ? classes.filter(function(x){ return x.id === opts.id; })[0] : null;
    editId = c ? c.id : null;
    fChild = c ? c.child : (opts.child || 'seoyeon');
    fDay = c ? c.day : (opts.day || todayDow() || 1);
    fCat = c ? c.cat : (opts.cat || 'etc');

    $('#sheetTitle').textContent = c ? '일정 수정' : '일정 추가';
    $('#fTitle').value = c ? c.title : '';
    $('#fStart').value = c ? c.start : '';
    $('#fEnd').value = c ? c.end : '';
    $('#fDelete').hidden = !c;
    syncSheet();

    var sheet = $('#sheet');
    sheet.hidden = false;
    requestAnimationFrame(function(){ sheet.classList.add('open'); });
  }

  function closeSheet(){
    var sheet = $('#sheet');
    sheet.classList.remove('open');
    setTimeout(function(){ sheet.hidden = true; }, 240);
  }

  /* ---------- 토스트 ---------- */
  var toastTimer = null;
  function hideToast(){
    var t = $('#toast');
    t.classList.remove('show');
    t.onclick = null;
  }
  function toast(msg, undo){
    var t = $('#toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">되돌리기</button>' : '');
    clearTimeout(toastTimer);
    if(undo){
      t.querySelector('button').onclick = function(){ undo(); hideToast(); };
    }
    t.classList.add('show');
    toastTimer = setTimeout(hideToast, undo ? 5000 : 2000);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function(e){
    var t = e.target;

    var tab = t.closest ? t.closest('.tab') : null;
    if(tab){ setView(tab.getAttribute('data-view')); return; }

    if(t.closest('[data-close]')){ closeSheet(); return; }

    var dayBtn = t.closest('.day[data-day]');
    if(dayBtn){ selDay = parseInt(dayBtn.getAttribute('data-day'), 10); renderToday(); return; }

    var kidtab = t.closest('.kidtab');
    if(kidtab){ weekChild = kidtab.getAttribute('data-child'); renderWeek(); return; }

    var del = t.closest('[data-del]');
    if(del){
      e.stopPropagation();
      removeClass(del.getAttribute('data-del'));
      return;
    }

    var addBtn = t.closest('[data-add]');
    if(addBtn){
      openSheet({ child: addBtn.getAttribute('data-add'), day: parseInt(addBtn.getAttribute('data-day'), 10) });
      return;
    }

    if(editMode){
      var row = t.closest('.row[data-id]');
      if(row){ openSheet({ id: row.getAttribute('data-id') }); return; }
      var chip = t.closest('.chip[data-id]');
      if(chip && !t.closest('[data-del]')){ openSheet({ id: chip.getAttribute('data-id') }); return; }
    }

    var tg = t.closest('[data-toggle]');
    if(tg){
      var cid = tg.getAttribute('data-child');
      var it = (homework[cid] || []).filter(function(x){ return x.id === tg.getAttribute('data-toggle'); })[0];
      if(it){ it.done = !it.done; saveHw(); renderHomework(); }
      return;
    }

    var rm = t.closest('[data-remove]');
    if(rm){
      var cid2 = rm.getAttribute('data-child');
      var rid = rm.getAttribute('data-remove');
      var removed = null, idx = -1;
      homework[cid2].forEach(function(x,i){ if(x.id === rid){ removed = x; idx = i; } });
      if(removed){
        homework[cid2].splice(idx,1);
        saveHw(); renderHomework();
        toast('지웠어요', function(){
          homework[cid2].splice(idx,0,removed);
          saveHw(); renderHomework();
        });
      }
      return;
    }

    var clr = t.closest('[data-clear]');
    if(clr){
      var cid3 = clr.getAttribute('data-clear');
      var before = homework[cid3].slice();
      homework[cid3] = homework[cid3].filter(function(x){ return !x.done; });
      saveHw(); renderHomework();
      toast('완료한 항목을 지웠어요', function(){ homework[cid3] = before; saveHw(); renderHomework(); });
      return;
    }

    var addhw = t.closest('[data-addhw]');
    if(addhw){ addHomework(addhw.getAttribute('data-addhw')); return; }

    if(t.closest('#editBtn')){ setEdit(!editMode); return; }
    if(t.closest('#settingsToggle')){ $('#settingsBody').hidden = !$('#settingsBody').hidden; return; }

    var wbtn = t.closest('[data-week]');
    if(wbtn){
      var step = parseInt(wbtn.getAttribute('data-week'), 10) || 0;
      var next = Math.max(-2, Math.min(2, mealWeekOffset + step));
      if(next !== mealWeekOffset){ mealWeekOffset = next; renderMeal(); }
      return;
    }

    if(t.closest('[data-alg]')){
      showAllergy = !showAllergy;
      try{ localStorage.setItem(KEY_ALG, showAllergy ? '1' : '0'); }catch(e){}
      renderMealViews();
      return;
    }
  });

  $('#fChild').addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]');
    if(b){ fChild = b.getAttribute('data-v'); syncSheet(); }
  });
  $('#fDay').addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]');
    if(b){ fDay = parseInt(b.getAttribute('data-v'), 10); syncSheet(); }
  });
  $('#fCat').addEventListener('click', function(e){
    var b = e.target.closest('button[data-cat]');
    if(b){ fCat = b.getAttribute('data-cat'); syncSheet(); }
  });

  $('#sheetForm').addEventListener('submit', function(e){
    e.preventDefault();
    var title = $('#fTitle').value.trim();
    var start = $('#fStart').value;
    var end = $('#fEnd').value;
    if(!title){ toast('이름을 적어 주세요'); $('#fTitle').focus(); return; }
    if(!TIME_RE.test(start)){ toast('시작 시간을 골라 주세요'); $('#fStart').focus(); return; }
    if(end && !TIME_RE.test(end)) end = '';
    if(end && toMin(end) <= toMin(start)){ toast('끝나는 시간이 시작보다 빨라요'); $('#fEnd').focus(); return; }

    if(editId){
      classes.forEach(function(c){
        if(c.id === editId){
          c.title = title; c.start = start; c.end = end;
          c.child = fChild; c.day = fDay; c.cat = fCat;
        }
      });
      saveSchedule();
      closeSheet();
      renderAll();
      toast('수정했어요');
    }else{
      classes.push({
        id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        child: fChild, day: fDay, title: title.slice(0,40), start: start, end: end, cat: fCat
      });
      saveSchedule();
      closeSheet();
      renderAll();
      toast('추가했어요');
    }
  });

  $('#fDelete').addEventListener('click', function(){
    if(!editId) return;
    removeClass(editId, true);
    closeSheet();
  });

  function removeClass(id, fromSheet){
    var idx = -1, removed = null;
    classes.forEach(function(c,i){ if(c.id === id){ removed = c; idx = i; } });
    if(!removed) return;
    classes.splice(idx,1);
    saveSchedule();
    renderAll();
    toast('일정을 지웠어요', function(){
      classes.splice(idx,0,removed);
      saveSchedule();
      renderAll();
    });
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.matches && e.target.matches('input[data-input-for]')){
      e.preventDefault();
      addHomework(e.target.getAttribute('data-input-for'));
    }
    if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  });

  function addHomework(childId){
    var input = $('input[data-input-for="' + childId + '"]');
    var sel = $('select[data-type-for="' + childId + '"]');
    if(!input) return;
    var text = input.value.trim();
    if(!text){
      input.focus();
      return;
    }
    homework[childId].push({
      id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,4),
      text: text,
      type: sel ? sel.value : '숙제',
      done: false
    });
    saveHw();
    renderHomework();
    var again = $('input[data-input-for="' + childId + '"]');
    if(again) again.focus();
  }

  /* ---------- 설정 ---------- */
  $('#btnReset').addEventListener('click', function(){
    if(!window.confirm('시간표를 처음 상태(26년 하반기)로 되돌릴까요?\n숙제 목록은 그대로 남아요.')) return;
    classes = defaultClasses();
    saveSchedule();
    renderAll();
    toast('기본 시간표로 되돌렸어요');
  });

  $('#btnBackup').addEventListener('click', function(){
    var k = kstNow();
    var stamp = k.getFullYear() + ('0'+(k.getMonth()+1)).slice(-2) + ('0'+k.getDate()).slice(-2);
    var data = {
      app: 'kids-board', version: 1, exportedAt: new Date().toISOString(),
      classes: classes, homework: homework
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '서연서우보드-백업-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('백업 파일을 저장했어요');
  });

  $('#fileImport').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var p = JSON.parse(String(reader.result));
        var s = p && p.classes ? sanitizeClasses(p.classes) : null;
        var h = p && p.homework ? sanitizeHw(p.homework) : null;
        if(!s && !h){ toast('이 파일에서는 내용을 찾지 못했어요'); return; }
        if(!window.confirm('지금 화면의 내용을 이 파일로 바꿀까요?')) return;
        if(s) classes = s;
        if(h) homework = h;
        saveSchedule(); saveHw(); renderAll();
        toast('불러왔어요');
      }catch(err){
        toast('파일을 읽지 못했어요');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  /* ---------- 시작 ---------- */
  load();
  loadMealCache();
  buildCatChips();
  renderAll();
  syncEditUi();
  loadStaticMeals();
  fetchMealsForWeek(0);

  setInterval(function(){
    renderHeader();
    if(view === 'today' && selDay === todayDow()) renderToday();
  }, 30000);

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){
      renderHeader();
      if(view === 'today') renderToday();
      if(view === 'week') renderWeek();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
